<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google-site-verification" content="aGwF_7PE_iZ0CFJ-JEAroTemrfBFtFwYTAth_Xq-a7Y">
  <!--SEO-->
  <meta name="theme-color" content="#f7f3ee">
  <meta name="theme-color" content="#232423" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 字体不阻塞首屏：先按 print 载入，脚本就绪后再切换为 all；被墙时只回退到系统字体。 -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;500;600&display=swap">
  <link id="font-css" rel="stylesheet" media="print" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/styles.css?v=20261031e">
</head>
<body>
  <div class="texture" aria-hidden="true"></div>
  <div id="app"><!--SEO-BODY-->
    <div class="boot" role="status" aria-live="polite">
      <div class="soft-loader" aria-hidden="true"><i></i><i></i><i></i></div>
      <p data-i18n="boot.preparing">正在准备映途…</p>
    </div>
  </div>
  <noscript><p class="noscript" data-i18n="noscript">映途需要 JavaScript 才能搜索，请开启后重试。</p></noscript>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <button id="back-top" class="back-top" type="button" data-i18n-aria="backTop" aria-label="返回顶部" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <dialog id="feedback-dialog" class="feedback-sheet" aria-labelledby="feedback-title">
    <form id="feedback-form" class="sheet-inner">
      <header class="sheet-head">
        <div>
          <span class="sheet-kicker" data-i18n="feedback.kicker">想看的，都可以说</span>
          <h2 id="feedback-title" data-i18n="feedback.title">给我们留句话</h2>
        </div>
        <button type="button" class="sheet-close" data-close-dialog data-i18n-aria="feedback.close" aria-label="关闭反馈窗口">×</button>
      </header>
      <p class="sheet-copy" data-i18n="feedback.copy">无论是补片建议、筛选体验还是页面问题，都欢迎直接写在这里。</p>
      <label class="field-label" for="feedback-message" data-i18n="feedback.msgLabel">留言内容</label>
      <textarea id="feedback-message" name="message" rows="6" minlength="2" maxlength="600" data-i18n-placeholder="feedback.msgPlaceholder" placeholder="比如：希望能按“已有会员的平台”筛选……" required></textarea>
      <label class="field-label" for="feedback-contact"><span class="label-main" data-i18n="feedback.contactLabel">联系方式</span><span data-i18n="feedback.optional">选填</span></label>
      <input id="feedback-contact" name="contact" type="text" maxlength="120" autocomplete="email" data-i18n-placeholder="feedback.contactPlaceholder" placeholder="邮箱或其他联系方式">
      <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <footer class="sheet-foot">
        <span data-i18n="feedback.note">演示环境 · 留言只保存在本地服务端</span>
        <button class="primary-action" type="submit" data-i18n="feedback.send">发送</button>
      </footer>
    </form>
  </dialog>

  <script src="/i18n.js?v=20261031e"></script>
  <script src="/api.js?v=20261031e"></script>
  <script src="/app.js?v=20261031e"></script>
</body>
</html>
